# Publish a release with a version tag (for example v3.2.2), or push the tag
# from the command line, and GitHub tests the code, then builds:
#   Windows       EaveLuxOS-Windows.zip
#   macOS         EaveLuxOS-macOS.dmg (Apple silicon)
#   Linux PC      eaveluxos_<ver>_amd64.deb + EaveLuxOS-Linux-x86_64.tar.gz
#   Raspberry Pi  eaveluxos_<ver>_arm64.deb + EaveLuxOS-Linux-aarch64.tar.gz (64-bit Pi OS)
# Linux builds run on Ubuntu 22.04 so they also work on older systems such as
# Raspberry Pi OS (a program built on newer Linux needs newer system libraries).
# The arm64 runner is free for public repositories.
name: Build executables
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install tzdata cryptography certifi pillow
      - run: python -m unittest
  build:
    needs: test
    strategy:
      matrix:
        # macOS 15 (4.7.3): the same Mac the tests run on, not a label that moves
        os: [windows-latest, macos-15, ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller==6.11.1 pillow==11.0.0 tzdata==2024.2 cryptography==44.0.0 certifi==2026.10.19
      # Windows (4.1.3): build PyInstaller's launcher from source. The ready-made
      # one is shared by countless programs, malware included, so Microsoft
      # Defender's behavior guesses flag apps built with it ("executes commands
      # from an attacker"). If the compile fails, the ready-made one is used.
      - if: runner.os == 'Windows'
        id: launcher
        continue-on-error: true
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: python -m pip install --force-reinstall --no-deps --no-binary pyinstaller pyinstaller==6.11.1
      # 4.1.4: say so on the run's page when it fell back, so Defender's false
      # alarm can't quietly come back.
      - if: runner.os == 'Windows' && steps.launcher.outcome == 'failure'
        run: echo "::warning title=PyInstaller launcher::Building the launcher from source failed; this release uses the ready-made one, which Microsoft Defender may flag."
      - run: python packaging/build.py
      - uses: actions/upload-artifact@v6
        with:
          name: EaveLuxOS-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.deb
            dist/*.tar.gz
  # One job attaches everything, so the release notes are written once (with
  # one upload per build machine, each added its own "Full Changelog" line),
  # and files are attached only when all four builds succeeded.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      # Checksums (4.1.3): compare with the file you downloaded, to be sure
      # it's the one GitHub built (certutil -hashfile FILE SHA256 on Windows).
      - run: cd dist && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - run: ls -l dist
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
