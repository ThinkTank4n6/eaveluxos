# After a merge, rebuilds index.json (the list EaveLuxOS reads) and commits it.
name: Build index
on:
  push:
    branches: [main]
    paths: ["patterns/**", "build_index.py"]
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: python3 build_index.py
      - run: |
          if ! git diff --quiet -- index.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.json
            git commit -m "Rebuild index.json"
            git push
          fi
